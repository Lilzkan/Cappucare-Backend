# ===================================================================
# Puerto dinámico compatible con Railway (variable de entorno PORT)
# Fallback local: 8080
# ===================================================================
server.port=${PORT:8080}

# ===================================================================
# Datasource: PostgreSQL en producción (Railway)
#             H2 en memoria para ejecución local sin configuración
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:h2:mem:cappucaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:SA}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:}

# ===================================================================
# JPA / Hibernate
# ===================================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Dialecto autodetectado por Hibernate segun la URL del datasource
# (H2 en local, PostgreSQL en Railway via DATABASE_URL)

# ===================================================================
# Jackson
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# Logging
# ===================================================================
logging.level.org.springframework.web=INFO
logging.level.com.cappucare.backend=INFO
